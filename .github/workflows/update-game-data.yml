name: Update game data

on:
  schedule:
    - cron: '17 18 * * 3'
      timezone: 'Asia/Taipei'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch and validate data without committing or deploying it
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-game-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install updater dependencies
        run: python -m pip install --requirement requirements-data-update.txt
      - name: Fetch and validate game data
        run: python scripts/update_game_data.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          RF_ACCOUNT_EMAIL: ${{ secrets.RF_ACCOUNT_EMAIL }}
          RF_ACCOUNT_PASSWORD: ${{ secrets.RF_ACCOUNT_PASSWORD }}
      - name: Detect changed data
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- return_data_example/nation.json return_data_example/cities.json return_data_example/update_metadata.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit updated data
        if: steps.diff.outputs.changed == 'true' && !inputs.dry_run
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add return_data_example/nation.json return_data_example/cities.json return_data_example/update_metadata.json
          git commit -m "chore(data): update game data at $(TZ=Asia/Taipei date +%F)"
          git push
      - name: Configure Pages
        if: steps.diff.outputs.changed == 'true' && !inputs.dry_run
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.diff.outputs.changed == 'true' && !inputs.dry_run
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true' && !inputs.dry_run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
