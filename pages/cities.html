<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RF 城鎮資訊 - 查看城鎮詳細資料、劇情標題、通關獎勵與掉落物資訊">
    <title>城鎮資訊 - RF 攻略網站</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/design-system.css">
</head>

<body>
    <!-- 導航欄 -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-brand">
                ⚔️ RF 攻略網站
            </a>
            <button class="navbar-toggle" onclick="toggleMenu()">☰</button>
            <ul class="navbar-menu" id="navMenu">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="cities.html" class="active">城鎮資訊</a></li>
                <li><a href="characters.html">角色資訊</a></li>
                <li><a href="calculator.html">戰力計算器</a></li>
                <li><a href="guide.html">新手教學</a></li>
                <li><a href="query.html">查詢功能</a></li>
                <li><a href="nations.html">國策資訊</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="content-wrapper">
            <div class="page-header">
                <h1>🏰 城鎮資訊</h1>
                <p>查看城鎮詳細資料、劇情標題、通關獎勵與掉落物資訊</p>
            </div>

            <!-- 搜尋與篩選 -->
            <div class="card data-toolbar">
                <div class="search-box">
                    <input type="text" id="citySearch" placeholder="搜尋城鎮名稱...">
                </div>

                <div class="grid grid-4">
                    <div class="form-group">
                        <label class="form-label">主權篩選</label>
                        <select class="form-control" id="factionFilter">
                            <option value="">全部主權</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">排序方式</label>
                        <select class="form-control" id="sortBy">
                            <option value="id">城鎮 ID</option>
                            <option value="name">名稱</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 城鎮列表 -->
            <div id="citiesContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 15px;">載入城鎮資料中...</p>
                </div>
            </div>

            <!-- 城鎮詳細資訊 Modal -->
            <div id="cityModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="modal-close" onclick="closeModal()">&times;</span>
                    <div id="cityDetail"></div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>RF 攻略網站 | 使用 GitHub Pages 建置</p>
        </footer>
    </div>

    <script src="../js/app.js"></script>
    <script>
        let citiesData = [];
        let rawCitiesData = [];

        // 從 JSON 載入城鎮資料
        async function loadCitiesData() {
            try {
                // 加入時間戳避免快取問題
                const timestamp = new Date().getTime();
                const response = await fetch(`../return_data_example/cities.json?t=${timestamp}`);
                const data = await response.json();
                rawCitiesData = data.cities || [];

                // 轉換資料格式
                citiesData = rawCitiesData.map(city => ({
                    id: city.id,
                    name: city.name,
                    owner: city.sovereign?.name || city.sovereign || city.control_nation?.name || '未知',
                    ownerId: city.sovereign?.id || city.control_nation?.id || 0,
                    sovereignId: city.sovereign?.id || 0,
                    chapter: city.chapter ? `${city.chapter.name} ${city.chapter.number}-${city.chapter.serial}` : '-',
                    storyTitle: city.title || '-',
                    description: city.description || '-',
                    pointDescription: city.point_description || null,
                    capital: city.capital,
                    status: city.status,
                    movable: city.movable,
                    sovereign: city.sovereign,
                    controlUnion: city.control_union?.name || null,
                    energyCharge: city.energy_charge,
                    bonus: city.bonus?.percentage || 0,
                    upCityId: city.up_city_id,
                    downCityId: city.down_city_id,
                    leftCityId: city.left_city_id,
                    rightCityId: city.right_city_id,
                    mapBuilding: city.map_building,
                    windowViewImage: city.window_view_image,
                    citySpoils: city.city_spoils || [],
                    reward: city.reward,
                    rewardCollected: city.reward_collected,
                    nationBattle: city.nation_battle,
                    hq: city.hq,
                    hijackable: city.hijackable
                }));

                buildSovereignFilter(citiesData);
                filterCities();
            } catch (error) {
                console.error('載入城鎮資料失敗:', error);
                document.getElementById('citiesContainer').innerHTML = `
                    <div class="alert alert-danger">
                        載入城鎮資料失敗，請確認 cities.json 檔案存在且格式正確。<br>
                        錯誤：${error.message}
                    </div>
                `;
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            document.getElementById('citySearch').value = params.get('q') || '';
            document.getElementById('sortBy').value = params.get('sort') || 'id';
            loadCitiesData();

            // 綁定搜尋事件
            document.getElementById('citySearch').addEventListener('input', debounce(filterCities, 300));
            document.getElementById('factionFilter').addEventListener('change', filterCities);
            document.getElementById('sortBy').addEventListener('change', filterCities);
        });

        // 篩選城鎮
        function filterCities() {
            const searchText = document.getElementById('citySearch').value.toLowerCase();
            const faction = document.getElementById('factionFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = citiesData.filter(city => {
                const matchSearch = city.name.toLowerCase().includes(searchText);
                const matchFaction = !faction || city.owner === faction;
                return matchSearch && matchFaction;
            });

            // 排序
            filtered.sort((a, b) => {
                if (sortBy === 'name') {
                    return a.name.localeCompare(b.name, 'zh-TW');
                }
                return a.id - b.id;
            });

            renderCities(filtered);
            const params = new URLSearchParams();
            if (searchText) params.set('q', searchText);
            if (faction) params.set('faction', faction);
            if (sortBy !== 'id') params.set('sort', sortBy);
            const query = params.toString();
            history.replaceState(null, '', `${window.location.pathname}${query ? `?${query}` : ''}`);
        }

        // 渲染城鎮列表
        function renderCities(cities) {
            const container = document.getElementById('citiesContainer');

            if (cities.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        沒有找到符合條件的城鎮
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <p style="margin-bottom: 15px; color: var(--muted-text);">共 ${cities.length} 個城鎮</p>
                <div class="grid grid-auto">
                    ${cities.map(city => `
                        <div class="card" onclick="showCityDetail(${city.id})" style="cursor: pointer;">
                            <div class="card-header">
                                <span class="card-title">${city.name}</span>
                                <span class="badge ${getSovereignClass(city.owner)}">${city.owner}</span>
                            </div>
                            <div class="card-body">
                                <p><strong>章節：</strong>${city.chapter}</p>
                                <p><strong>劇情：</strong>${city.storyTitle}</p>
                                ${city.owner ? `<p><strong>主權：</strong>${city.owner}</p>` : ''}
                                ${city.capital ? '<span class="badge badge-warning">首都</span>' : ''}
                                ${city.hq ? '<span class="badge badge-info">總部</span>' : ''}
                                <div style="margin-top: 15px;">
                                    <span class="badge badge-success">ID: ${city.id}</span>
                                    ${city.movable ? '<span class="badge badge-info">可進入</span>' : '<span class="badge badge-muted">無法進入</span>'}
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function buildSovereignFilter(cities) {
            const select = document.getElementById('factionFilter');
            if (!select) return;

            const names = Array.from(new Set(
                cities
                    .map(city => city.owner)
                    .filter(Boolean)
            )).sort((a, b) => a.localeCompare(b, 'zh-TW'));

            const options = ['<option value="">全部主權</option>']
                .concat(names.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`));

            const current = select.value;
            select.innerHTML = options.join('');
            const requested = new URLSearchParams(window.location.search).get('faction');
            if (requested || current) select.value = requested || current;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 顯示城鎮詳情
        function showCityDetail(cityId) {
            const city = citiesData.find(c => c.id === cityId);
            if (!city) return;

            const modal = document.getElementById('cityModal');
            const detail = document.getElementById('cityDetail');

            // 找出相鄰城鎮名稱
            const getCityName = (id) => {
                if (!id) return '無';
                const found = citiesData.find(c => c.id === id);
                return found ? found.name : `ID: ${id}`;
            };

            // 渲染掉落物品
            const renderSpoils = (spoils) => {
                if (!spoils || spoils.length === 0) {
                    return '<p style="color: var(--muted-text);">無掉落物品資料</p>';
                }

                // 分離固定掉落和隨機掉落
                const fixedSpoils = spoils.filter(s => !s.random);
                const randomSpoils = spoils.filter(s => s.random);
                const randomCount = randomSpoils.length;

                let html = '';

                // 固定掉落
                if (fixedSpoils.length > 0) {
                    html += '<h4 style="margin-bottom: 10px; color: var(--success-color);">🎁 固定獎勵</h4>';
                    html += fixedSpoils.map((spoil, idx) => {
                        if (!spoil.items || spoil.items.length === 0) return '';
                        return `
                            <div style="margin-bottom: 15px;">
                                <table class="table">
                                    <thead>
                                        <tr><th>物品</th><th>數量</th><th>類型</th></tr>
                                    </thead>
                                    <tbody>
                                        ${spoil.items.map(item => `
                                            <tr>
                                                <td>
                                                    ${item.image_url ? `<img src="${getAssetPath(item.image_url)}" alt="${item.name}" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 5px;">` : ''}
                                                    ${item.name}
                                                </td>
                                                <td>${item.quantity || '-'}</td>
                                                <td>${item.item_type || '-'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    }).join('');
                }

                // 隨機掉落
                if (randomSpoils.length > 0) {
                    // 計算 reference 總和
                    const totalReference = randomSpoils.reduce((sum, s) => sum + (s.reference || 1), 0);

                    html += '<h4 style="margin: 20px 0 10px; color: var(--warning-color);">🎲 隨機獎勵</h4>';
                    html += `<p style="margin-bottom: 10px; color: var(--muted-text); font-size: 0.9em;">共 ${randomCount} 種可能，每次通關隨機獲得其中一種</p>`;
                    html += randomSpoils.map((spoil, idx) => {
                        if (!spoil.items || spoil.items.length === 0) return '';
                        // 計算機率：使用 reference 欄位加總計算真實掉落機率
                        const reference = spoil.reference || 1;
                        const probability = (reference / totalReference) * 100;
                        return `
                            <div style="margin-bottom: 15px; border-left: 3px solid var(--warning-color); padding-left: 15px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                    <span style="font-weight: bold;">選項 ${idx + 1}</span>
                                    <span class="badge badge-warning">機率：${probability.toFixed(1)}%</span>
                                </div>
                                <table class="table">
                                    <thead>
                                        <tr><th>物品</th><th>數量</th><th>類型</th></tr>
                                    </thead>
                                    <tbody>
                                        ${spoil.items.map(item => `
                                            <tr>
                                                <td>
                                                    ${item.image_url ? `<img src="${getAssetPath(item.image_url)}" alt="${item.name}" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 5px;">` : ''}
                                                    ${item.name}
                                                </td>
                                                <td>${item.quantity || '-'}</td>
                                                <td>${item.item_type || '-'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    }).join('');
                }

                return html || '<p style="color: var(--muted-text);">無掉落物品資料</p>';
            };

            detail.innerHTML = `
                <h2 style="color: var(--primary-color); margin-bottom: 20px;">
                    🏰 ${city.name}
                    <span class="badge ${getSovereignClass(city.owner)}" style="margin-left: 10px;">${city.owner}</span>
                    ${city.capital ? '<span class="badge badge-warning" style="margin-left: 5px;">首都</span>' : ''}
                </h2>
                
                <div class="grid grid-2" style="gap: 25px;">
                    <div>
                        <h3 style="margin-bottom: 15px;">📖 基本資訊</h3>
                        <table class="table">
                            <tr><th>城鎮 ID</th><td>${city.id}</td></tr>
                            <tr><th>章節</th><td>${city.chapter}</td></tr>
                            <tr><th>劇情標題</th><td>${city.storyTitle}</td></tr>
                            <tr><th>說明</th><td>${city.pointDescription || city.description}</td></tr>
                            <tr><th>主權</th><td>${city.sovereign || '-'}</td></tr>
                            <tr><th>控制軍團</th><td>${city.controlUnion || '-'}</td></tr>
                            <tr><th>狀態</th><td>${city.movable ? '可進入' : '無法進入'}</td></tr>
                        </table>
                    </div>
                    
                    <div>
                        <h3 style="margin-bottom: 15px;">🗺️ 地圖資訊</h3>
                        <table class="table">
                            <tr><th>上方城鎮</th><td>${getCityName(city.upCityId)}</td></tr>
                            <tr><th>下方城鎮</th><td>${getCityName(city.downCityId)}</td></tr>
                            <tr><th>左方城鎮</th><td>${getCityName(city.leftCityId)}</td></tr>
                            <tr><th>右方城鎮</th><td>${getCityName(city.rightCityId)}</td></tr>
                            <tr><th>消耗體力</th><td>${city.energyCharge || '-'}</td></tr>
                            <tr><th>加成</th><td>${city.bonus}%</td></tr>
                            <tr><th>可劫持</th><td>${city.hijackable ? '是' : '否'}</td></tr>
                        </table>
                    </div>
                </div>
                
                <div style="margin-top: 25px;">
                    <h3 style="margin-bottom: 15px;">📦 掉落物品</h3>
                    ${renderSpoils(city.citySpoils)}
                </div>
            `;

            modal.style.display = 'flex';
        }

        // 以主權名稱取得顏色 class
        function getSovereignClass(name) {
            const classes = {
                '人民共和國': 'sovereign-people',
                '人民共和國(紅軍)': 'sovereign-people',
                '紅軍': 'sovereign-people',
                '臺灣': 'sovereign-taiwan',
                '台灣': 'sovereign-taiwan',
                '日本皇國': 'sovereign-japan',
                '印度支那聯盟': 'sovereign-indochina',
                '哈里發聯盟': 'sovereign-caliphate',
                '大韓邦聯': 'sovereign-korea',
                '努山達拉聯盟': 'sovereign-nusantara',
                '婆羅多聯盟': 'sovereign-bharata',
                '盎格魯國協': 'sovereign-anglo',
                '歐羅巴聯盟': 'sovereign-europa',
                '大北方國協': 'sovereign-northern'
            };
            return classes[name] || '';
        }

        // 關閉 Modal
        function closeModal() {
            document.getElementById('cityModal').style.display = 'none';
        }

        // 點擊 Modal 外部關閉
        document.getElementById('cityModal')?.addEventListener('click', function (e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>

    <style>
        /* Modal 樣式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 30px;
            border-radius: 15px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            font-size: 2em;
            cursor: pointer;
            color: var(--muted-text);
            transition: color 0.3s;
            z-index: 10;
            background: var(--card-bg);
            padding: 0 5px;
            border-radius: 50%;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--danger-color);
        }

        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                margin: 10px;
            }

            #cityDetail .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>

</html>
