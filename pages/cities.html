<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RF 城鎮資訊 - 查看城鎮詳細資料、劇情標題、通關獎勵與掉落物資訊">
    <title>城鎮資訊 - RF 攻略網站</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/design-system.css">
</head>

<body>
    <!-- 導航欄 -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-brand">
                ⚔️ RF 攻略網站
            </a>
            <button class="navbar-toggle" onclick="toggleMenu()">☰</button>
            <ul class="navbar-menu" id="navMenu">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="cities.html" class="active">城鎮資訊</a></li>
                <li><a href="characters.html">角色資訊</a></li>
                <li><a href="calculator.html">戰力計算器</a></li>
                <li><a href="guide.html">新手教學</a></li>
                <li><a href="query.html">查詢功能</a></li>
                <li><a href="nations.html">國策資訊</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="content-wrapper">
            <div class="page-header">
                <h1>🏰 城鎮資訊</h1>
                <p>查看城鎮詳細資料、劇情標題、通關獎勵與掉落物資訊</p>
            </div>

            <!-- 搜尋與篩選 -->
            <div class="card data-toolbar">
                <div class="search-box">
                    <input type="text" id="citySearch" placeholder="搜尋城鎮名稱...">
                </div>

                <div class="grid grid-4">
                    <div class="form-group">
                        <label class="form-label">主權篩選</label>
                        <select class="form-control" id="factionFilter">
                            <option value="">全部主權</option>
                        </select>
                    </div>

                    <div class="form-group" id="workstationFilterGroup" style="display: none;">
                        <label class="form-label">工作站種類</label>
                        <select class="form-control" id="workstationFilter">
                            <option value="">全部工作站</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">劇情</label>
                        <select class="form-control" id="plotFilter">
                            <option value="">不限</option>
                            <option value="story">有章節劇情</option>
                            <option value="sites">有劇情地點</option>
                            <option value="both">兩者都有</option>
                            <option value="none">兩者都沒有</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">排序方式</label>
                        <select class="form-control" id="sortBy">
                            <option value="id">城鎮 ID</option>
                            <option value="name">名稱</option>
                            <option value="ws-desc">工作站數量（多→少）</option>
                            <option value="ws-asc">工作站數量（少→多）</option>
                            <option value="plots-desc">劇情地點數（多→少）</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 城鎮列表 -->
            <div id="citiesContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 15px;">載入城鎮資料中...</p>
                </div>
            </div>

            <!-- 城鎮詳細資訊 Modal -->
            <div id="cityModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="modal-close" onclick="closeModal()">&times;</span>
                    <div id="cityDetail"></div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>RF 攻略網站 | 使用 GitHub Pages 建置</p>
        </footer>
    </div>

    <script src="../js/app.js"></script>
    <script>
        let citiesData = [];
        let rawCitiesData = [];
        let citySitesData = {};   // { [cityId]: city_sites 回應 }

        // 從 JSON 載入城鎮資料
        async function loadCitiesData() {
            try {
                // 加入時間戳避免快取問題
                const timestamp = new Date().getTime();
                const response = await fetch(`../return_data_example/cities.json?t=${timestamp}`);
                const data = await response.json();
                rawCitiesData = data.cities || [];

                // 轉換資料格式
                citiesData = rawCitiesData.map(city => ({
                    id: city.id,
                    name: city.name,
                    owner: city.sovereign?.name || city.sovereign || city.control_nation?.name || '未知',
                    ownerId: city.sovereign?.id || city.control_nation?.id || 0,
                    sovereignId: city.sovereign?.id || 0,
                    chapter: city.chapter ? `${city.chapter.name} ${city.chapter.number}-${city.chapter.serial}` : '-',
                    storyTitle: city.title || '-',
                    description: city.description || '-',
                    pointDescription: city.point_description || null,
                    capital: city.capital,
                    status: city.status,
                    movable: city.movable,
                    sovereign: city.sovereign,
                    controlUnion: city.control_union?.name || null,
                    energyCharge: city.energy_charge,
                    bonus: city.bonus?.percentage || 0,
                    upCityId: city.up_city_id,
                    downCityId: city.down_city_id,
                    leftCityId: city.left_city_id,
                    rightCityId: city.right_city_id,
                    mapBuilding: city.map_building,
                    windowViewImage: city.window_view_image,
                    citySpoils: city.city_spoils || [],
                    reward: city.reward,
                    rewardCollected: city.reward_collected,
                    nationBattle: city.nation_battle,
                    hq: city.hq,
                    hijackable: city.hijackable
                }));

                buildSovereignFilter(citiesData);
                filterCities();

                // 城內地點為選用資料集，缺檔時靜默略過
                loadCitySitesData();
            } catch (error) {
                console.error('載入城鎮資料失敗:', error);
                document.getElementById('citiesContainer').innerHTML = `
                    <div class="alert alert-danger">
                        載入城鎮資料失敗，請確認 cities.json 檔案存在且格式正確。<br>
                        錯誤：${error.message}
                    </div>
                `;
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function () {
            const params = new URLSearchParams(window.location.search);
            document.getElementById('citySearch').value = params.get('q') || '';
            document.getElementById('sortBy').value = params.get('sort') || 'id';
            document.getElementById('plotFilter').value = params.get('plot') || '';
            loadCitiesData();

            // 綁定搜尋事件
            document.getElementById('citySearch').addEventListener('input', debounce(filterCities, 300));
            document.getElementById('factionFilter').addEventListener('change', filterCities);
            document.getElementById('sortBy').addEventListener('change', filterCities);
            document.getElementById('workstationFilter')?.addEventListener('change', filterCities);
            document.getElementById('plotFilter')?.addEventListener('change', filterCities);
        });

        // 用 city_sites 資料充實城鎮清單（工作站種類/數量、劇情地點數）
        function enrichCitiesWithSites() {
            citiesData.forEach(city => {
                const payload = citySitesData[String(city.id)];
                const sites = payload ? extractSites(payload) : [];

                const wsCounts = {};
                let wsTotal = 0;
                let plotCount = 0;

                sites.forEach(site => {
                    if (site.reference_type === 'Workstation') {
                        const name = normalizeWorkstationName(site);
                        wsCounts[name] = (wsCounts[name] || 0) + 1;
                        wsTotal += 1;
                    } else if (site.reference_type) {
                        plotCount += 1;
                    }
                });

                city.hasSiteData = Boolean(payload);
                city.workstations = wsCounts;
                city.workstationTotal = wsTotal;
                city.plotCount = plotCount;
                city.builtWorkstations = payload?.workstation_count ?? null;
            });
        }

        // 依實際資料建立工作站種類選單
        function buildWorkstationFilter() {
            const select = document.getElementById('workstationFilter');
            const group = document.getElementById('workstationFilterGroup');
            if (!select || !group) return;

            const counts = {};
            citiesData.forEach(city => {
                Object.entries(city.workstations || {}).forEach(([name, n]) => {
                    counts[name] = (counts[name] || 0) + n;
                });
            });

            const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
            if (names.length === 0) return;   // 無 city_sites 資料時保持隱藏

            const options = ['<option value="">全部工作站</option>']
                .concat(names.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}（${counts[name]} 格）</option>`));
            select.innerHTML = options.join('');

            const requested = new URLSearchParams(window.location.search).get('ws');
            if (requested && names.includes(requested)) select.value = requested;

            group.style.display = '';
        }

        // 篩選城鎮
        function filterCities() {
            const searchText = document.getElementById('citySearch').value.toLowerCase();
            const faction = document.getElementById('factionFilter').value;
            const sortBy = document.getElementById('sortBy').value;
            const workstation = document.getElementById('workstationFilter')?.value || '';
            const plotMode = document.getElementById('plotFilter')?.value || '';

            let filtered = citiesData.filter(city => {
                const matchSearch = city.name.toLowerCase().includes(searchText);
                const matchFaction = !faction || city.owner === faction;
                const matchWorkstation = !workstation || Boolean((city.workstations || {})[workstation]);

                const hasStory = Boolean(city.storyTitle && city.storyTitle !== '-');
                const hasPlots = (city.plotCount || 0) > 0;
                let matchPlot = true;
                if (plotMode === 'story') matchPlot = hasStory;
                else if (plotMode === 'sites') matchPlot = hasPlots;
                else if (plotMode === 'both') matchPlot = hasStory && hasPlots;
                else if (plotMode === 'none') matchPlot = !hasStory && !hasPlots;

                return matchSearch && matchFaction && matchWorkstation && matchPlot;
            });

            // 排序
            filtered.sort((a, b) => {
                if (sortBy === 'name') {
                    return a.name.localeCompare(b.name, 'zh-TW');
                }
                if (sortBy === 'ws-desc') {
                    return (b.workstationTotal || 0) - (a.workstationTotal || 0) || a.id - b.id;
                }
                if (sortBy === 'ws-asc') {
                    return (a.workstationTotal || 0) - (b.workstationTotal || 0) || a.id - b.id;
                }
                if (sortBy === 'plots-desc') {
                    return (b.plotCount || 0) - (a.plotCount || 0) || a.id - b.id;
                }
                return a.id - b.id;
            });

            renderCities(filtered);

            const params = new URLSearchParams();
            if (searchText) params.set('q', searchText);
            if (faction) params.set('faction', faction);
            if (workstation) params.set('ws', workstation);
            if (plotMode) params.set('plot', plotMode);
            if (sortBy !== 'id') params.set('sort', sortBy);
            const query = params.toString();
            history.replaceState(null, '', `${window.location.pathname}${query ? `?${query}` : ''}`);
        }

        // 卡片上的工作站摘要
        function renderWorkstationBadges(city) {
            if (!city.hasSiteData) return '';
            if (!city.workstationTotal) {
                return '<span class="badge badge-muted">無工作站</span>';
            }
            const parts = Object.entries(city.workstations)
                .sort((a, b) => b[1] - a[1])
                .map(([name, n]) => `${escapeHtml(name)}${n > 1 ? `×${n}` : ''}`)
                .join('、');
            return `<span class="badge badge-primary" title="${parts}">🏗️ 工作站 ${city.workstationTotal}</span>`;
        }

        // 渲染城鎮列表
        function renderCities(cities) {
            const container = document.getElementById('citiesContainer');

            if (cities.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        沒有找到符合條件的城鎮
                    </div>
                `;
                return;
            }

            const totalWs = cities.reduce((sum, c) => sum + (c.workstationTotal || 0), 0);
            const totalPlots = cities.reduce((sum, c) => sum + (c.plotCount || 0), 0);
            const summary = [
                `共 ${cities.length} 個城鎮`,
                totalWs ? `${totalWs} 格工作站` : '',
                totalPlots ? `${totalPlots} 處劇情地點` : ''
            ].filter(Boolean).join('｜');

            container.innerHTML = `
                <p style="margin-bottom: 15px; color: var(--muted-text);">${summary}</p>
                <div class="grid grid-auto">
                    ${cities.map(city => {
                        const hasStory = Boolean(city.storyTitle && city.storyTitle !== '-');
                        return `
                        <div class="card" onclick="showCityDetail(${city.id})" style="cursor: pointer;">
                            <div class="card-header">
                                <span class="card-title">${city.name}</span>
                                <span class="badge ${getSovereignClass(city.owner)}">${city.owner}</span>
                            </div>
                            <div class="card-body">
                                <p><strong>章節：</strong>${city.chapter}</p>
                                <p><strong>劇情：</strong>${city.storyTitle}</p>
                                ${city.owner ? `<p><strong>主權：</strong>${city.owner}</p>` : ''}
                                ${city.capital ? '<span class="badge badge-warning">首都</span>' : ''}
                                ${city.hq ? '<span class="badge badge-info">總部</span>' : ''}
                                <div style="margin-top: 15px; display: flex; gap: 6px; flex-wrap: wrap;">
                                    <span class="badge badge-success">ID: ${city.id}</span>
                                    ${city.movable ? '<span class="badge badge-info">可進入</span>' : '<span class="badge badge-muted">無法進入</span>'}
                                    ${hasStory ? '<span class="badge badge-warning">📖 有劇情</span>' : ''}
                                    ${city.plotCount ? `<span class="badge badge-warning">🚩 劇情地點 ${city.plotCount}</span>` : ''}
                                    ${renderWorkstationBadges(city)}
                                </div>
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function buildSovereignFilter(cities) {
            const select = document.getElementById('factionFilter');
            if (!select) return;

            const names = Array.from(new Set(
                cities
                    .map(city => city.owner)
                    .filter(Boolean)
            )).sort((a, b) => a.localeCompare(b, 'zh-TW'));

            const options = ['<option value="">全部主權</option>']
                .concat(names.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`));

            const current = select.value;
            select.innerHTML = options.join('');
            const requested = new URLSearchParams(window.location.search).get('faction');
            if (requested || current) select.value = requested || current;
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 載入城內地點（由 update_game_data.py --city-sites 產生，可能不存在）
        async function loadCitySitesData() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`../return_data_example/city_sites.json?t=${timestamp}`);
                if (!response.ok) return;
                const data = await response.json();
                citySitesData = data.sites || {};
                console.log(`🏗️ 已載入 ${Object.keys(citySitesData).length} 座城市的城內地點資料`);
                enrichCitiesWithSites();
                buildWorkstationFilter();
                filterCities();   // 資料到齊後重畫，讓工作站/劇情標記與排序生效
            } catch (e) {
                console.info('未提供城內地點資料，略過此區塊。');
            }
        }

        // 從 city_sites 回應中取出地點陣列
        function extractSites(payload) {
            if (!payload) return [];
            if (Array.isArray(payload)) return payload;
            for (const key of ['sites', 'city_sites', 'site']) {
                if (Array.isArray(payload[key])) return payload[key];
            }
            return [];
        }

        // 地點型別標籤
        const SITE_TYPE_LABELS = {
            Workstation: '工作站',
            Explore: '探索',
            Visit: '拜訪',
            Access: '通道'
        };

        // 解鎖條件（condition 是物件，不是字串）
        function formatSiteCondition(condition) {
            if (!condition || typeof condition !== 'object') return '-';
            const ref = condition.reference_name;
            if (!ref) return '-';
            if (condition.type === 'Actor') {
                return `需要角色「${escapeHtml(ref)}」`;
            }
            if (condition.type === 'SitePlot') {
                const lv = condition.ref_level ? ` Lv.${escapeHtml(condition.ref_level)}` : '';
                return `需先完成地點「${escapeHtml(ref)}」${lv}`;
            }
            return `${escapeHtml(condition.type || '條件')}：${escapeHtml(ref)}`;
        }

        // 宗教類工作站的名稱與限制會隨幹部信仰改變（扎倉／教堂／清真寺…），
        // 一律正規化成「宗教」，並且不顯示當下的教派限制。
        function normalizeWorkstationName(site) {
            if (site.religious) return '宗教';
            return site.ws_name || '未知';
        }

        // 可建工作站（依種類彙總，每種固定產出一種道具）
        function renderWorkstations(sites) {
            const slots = sites.filter(s => s.reference_type === 'Workstation');
            if (slots.length === 0) return '';

            const grouped = new Map();
            slots.forEach(slot => {
                const key = normalizeWorkstationName(slot);
                if (!grouped.has(key)) {
                    grouped.set(key, {
                        name: key,
                        prop: slot.prop_name,
                        sameNation: slot.same_nation,
                        count: 0
                    });
                }
                grouped.get(key).count += 1;
            });

            return `
                <h4 style="margin: 18px 0 10px;">🏗️ 可建工作站 <span style="font-size: 0.85em; font-weight: normal; color: var(--muted-text);">(${slots.length} 格)</span></h4>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr><th>工作站</th><th>產出道具</th><th>格數</th><th>限制</th></tr>
                        </thead>
                        <tbody>
                            ${[...grouped.values()].map(ws => {
                                const limits = ws.sameNation ? '需同陣營' : '—';
                                return `
                                    <tr>
                                        <td><strong>${escapeHtml(ws.name)}</strong></td>
                                        <td>${escapeHtml(ws.prop || '-')}</td>
                                        <td>${ws.count}</td>
                                        <td>${limits}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 劇情地點（探索 / 拜訪 / 通道）
        function renderSitePlots(sites) {
            const plots = sites.filter(s => s.reference_type && s.reference_type !== 'Workstation');
            if (plots.length === 0) return '';

            return `
                <h4 style="margin: 18px 0 10px;">📖 劇情地點 <span style="font-size: 0.85em; font-weight: normal; color: var(--muted-text);">(${plots.length} 處)</span></h4>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr><th>地點</th><th>類型</th><th>進度</th><th>體力</th><th>解鎖條件</th></tr>
                        </thead>
                        <tbody>
                            ${plots.map(plot => {
                                const type = SITE_TYPE_LABELS[plot.reference_type] || plot.reference_type;
                                const progress = plot.max_level ? `${escapeHtml(plot.cur_level ?? '-')} / ${escapeHtml(plot.max_level)}` : '-';
                                const via = plot.access_city_name && plot.access_city_name !== plot.name
                                    ? `<br><span style="font-size: 0.85em; color: var(--muted-text);">通往 ${escapeHtml(plot.access_city_name)}</span>`
                                    : '';
                                return `
                                    <tr>
                                        <td><strong>${escapeHtml(plot.name || '-')}</strong>${via}</td>
                                        <td><span class="badge badge-info">${escapeHtml(type)}</span></td>
                                        <td>${progress}</td>
                                        <td>${escapeHtml(plot.energy_charge ?? '-')}</td>
                                        <td>${formatSiteCondition(plot.condition)}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 城王榜
        function renderCityKings(kings) {
            if (!Array.isArray(kings) || kings.length === 0) return '';
            const sorted = [...kings].sort((a, b) => (a.rank ?? 99) - (b.rank ?? 99));
            return `
                <h4 style="margin: 18px 0 10px;">👑 城王</h4>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    ${sorted.map(king => `
                        <div style="display: flex; align-items: center; gap: 10px;">
                            ${king.avatar ? `<img src="${getAssetPath(king.avatar)}" alt="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover;" onerror="this.style.display='none'">` : ''}
                            ${king.emblem ? `<img src="${getAssetPath(king.emblem)}" alt="" style="width: 20px; height: 20px;" onerror="this.style.display='none'">` : ''}
                            <span>${king.rank ? `<span class="badge badge-warning">#${escapeHtml(king.rank)}</span> ` : ''}<strong>${escapeHtml(king.nickname || king.name || '-')}</strong></span>
                            ${king.points !== undefined && king.points !== null ? `<span style="color: var(--muted-text);">${escapeHtml(king.points)} 點</span>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // UW 滲透（key 為陣營 ID）
        function renderDominance(dominance) {
            if (!dominance || Object.keys(dominance).length === 0) return '';
            const entries = Object.entries(dominance)
                .map(([nationId, pct]) => ({ name: getNationName(Number(nationId)), pct: Number(pct) || 0 }))
                .sort((a, b) => b.pct - a.pct);
            return `
                <h4 style="margin: 18px 0 10px;">🕳️ UW 滲透</h4>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    ${entries.map(entry => `
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <span style="min-width: 90px;">${escapeHtml(entry.name)}</span>
                            <div style="flex: 1; background: var(--border-color); border-radius: 4px; height: 10px; overflow: hidden;">
                                <div style="width: ${entry.pct}%; height: 100%; background: var(--primary-color);"></div>
                            </div>
                            <span style="min-width: 45px; text-align: right;">${entry.pct}%</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 渲染城內地點區塊
        function renderCitySites(cityId) {
            const payload = citySitesData[String(cityId)];
            if (!payload) return '';

            const sites = extractSites(payload);
            const body = [
                renderDominance(payload.uw_dominance),
                renderCityKings(payload.kings),
                renderWorkstations(sites),
                renderSitePlots(sites)
            ].filter(Boolean).join('');

            if (!body) return '';

            const built = payload.workstation_count;
            return `
                <div style="margin-top: 25px;">
                    <h3 style="margin-bottom: 5px;">
                        🏙️ 城內資訊
                        ${built !== undefined && built !== null ? `<span class="badge badge-muted" style="margin-left: 8px;">已建工作站 ${escapeHtml(built)}</span>` : ''}
                        ${payload.can_collect_all ? '<span class="badge badge-success" style="margin-left: 5px;">可一鍵收取</span>' : ''}
                    </h3>
                    ${body}
                </div>
            `;
        }

        // 顯示城鎮詳情
        function showCityDetail(cityId) {
            const city = citiesData.find(c => c.id === cityId);
            if (!city) return;

            const modal = document.getElementById('cityModal');
            const detail = document.getElementById('cityDetail');

            // 找出相鄰城鎮名稱
            const getCityName = (id) => {
                if (!id) return '無';
                const found = citiesData.find(c => c.id === id);
                return found ? found.name : `ID: ${id}`;
            };

            // 渲染掉落物品
            const renderSpoils = (spoils) => {
                if (!spoils || spoils.length === 0) {
                    return '<p style="color: var(--muted-text);">無掉落物品資料</p>';
                }

                // 分離固定掉落和隨機掉落
                const fixedSpoils = spoils.filter(s => !s.random);
                const randomSpoils = spoils.filter(s => s.random);
                const randomCount = randomSpoils.length;

                let html = '';

                // 固定掉落
                if (fixedSpoils.length > 0) {
                    html += '<h4 style="margin-bottom: 10px; color: var(--success-color);">🎁 固定獎勵</h4>';
                    html += fixedSpoils.map((spoil, idx) => {
                        if (!spoil.items || spoil.items.length === 0) return '';
                        return `
                            <div style="margin-bottom: 15px;">
                                <table class="table">
                                    <thead>
                                        <tr><th>物品</th><th>數量</th><th>類型</th></tr>
                                    </thead>
                                    <tbody>
                                        ${spoil.items.map(item => `
                                            <tr>
                                                <td>
                                                    ${item.image_url ? `<img src="${getAssetPath(item.image_url)}" alt="${item.name}" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 5px;">` : ''}
                                                    ${item.name}
                                                </td>
                                                <td>${item.quantity || '-'}</td>
                                                <td>${item.item_type || '-'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    }).join('');
                }

                // 隨機掉落
                if (randomSpoils.length > 0) {
                    // 計算 reference 總和
                    const totalReference = randomSpoils.reduce((sum, s) => sum + (s.reference || 1), 0);

                    html += '<h4 style="margin: 20px 0 10px; color: var(--warning-color);">🎲 隨機獎勵</h4>';
                    html += `<p style="margin-bottom: 10px; color: var(--muted-text); font-size: 0.9em;">共 ${randomCount} 種可能，每次通關隨機獲得其中一種</p>`;
                    html += randomSpoils.map((spoil, idx) => {
                        if (!spoil.items || spoil.items.length === 0) return '';
                        // 計算機率：使用 reference 欄位加總計算真實掉落機率
                        const reference = spoil.reference || 1;
                        const probability = (reference / totalReference) * 100;
                        return `
                            <div style="margin-bottom: 15px; border-left: 3px solid var(--warning-color); padding-left: 15px;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                    <span style="font-weight: bold;">選項 ${idx + 1}</span>
                                    <span class="badge badge-warning">機率：${probability.toFixed(1)}%</span>
                                </div>
                                <table class="table">
                                    <thead>
                                        <tr><th>物品</th><th>數量</th><th>類型</th></tr>
                                    </thead>
                                    <tbody>
                                        ${spoil.items.map(item => `
                                            <tr>
                                                <td>
                                                    ${item.image_url ? `<img src="${getAssetPath(item.image_url)}" alt="${item.name}" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 5px;">` : ''}
                                                    ${item.name}
                                                </td>
                                                <td>${item.quantity || '-'}</td>
                                                <td>${item.item_type || '-'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    }).join('');
                }

                return html || '<p style="color: var(--muted-text);">無掉落物品資料</p>';
            };

            detail.innerHTML = `
                <h2 style="color: var(--primary-color); margin-bottom: 20px;">
                    🏰 ${city.name}
                    <span class="badge ${getSovereignClass(city.owner)}" style="margin-left: 10px;">${city.owner}</span>
                    ${city.capital ? '<span class="badge badge-warning" style="margin-left: 5px;">首都</span>' : ''}
                </h2>
                
                <div class="grid grid-2" style="gap: 25px;">
                    <div>
                        <h3 style="margin-bottom: 15px;">📖 基本資訊</h3>
                        <table class="table">
                            <tr><th>城鎮 ID</th><td>${city.id}</td></tr>
                            <tr><th>章節</th><td>${city.chapter}</td></tr>
                            <tr><th>劇情標題</th><td>${city.storyTitle}</td></tr>
                            <tr><th>說明</th><td>${city.pointDescription || city.description}</td></tr>
                            <tr><th>主權</th><td>${city.sovereign || '-'}</td></tr>
                            <tr><th>控制軍團</th><td>${city.controlUnion || '-'}</td></tr>
                            <tr><th>狀態</th><td>${city.movable ? '可進入' : '無法進入'}</td></tr>
                        </table>
                    </div>
                    
                    <div>
                        <h3 style="margin-bottom: 15px;">🗺️ 地圖資訊</h3>
                        <table class="table">
                            <tr><th>上方城鎮</th><td>${getCityName(city.upCityId)}</td></tr>
                            <tr><th>下方城鎮</th><td>${getCityName(city.downCityId)}</td></tr>
                            <tr><th>左方城鎮</th><td>${getCityName(city.leftCityId)}</td></tr>
                            <tr><th>右方城鎮</th><td>${getCityName(city.rightCityId)}</td></tr>
                            <tr><th>消耗體力</th><td>${city.energyCharge || '-'}</td></tr>
                            <tr><th>加成</th><td>${city.bonus}%</td></tr>
                            <tr><th>可劫持</th><td>${city.hijackable ? '是' : '否'}</td></tr>
                        </table>
                    </div>
                </div>
                
                <div style="margin-top: 25px;">
                    <h3 style="margin-bottom: 15px;">📦 掉落物品</h3>
                    ${renderSpoils(city.citySpoils)}
                </div>

                ${renderCitySites(city.id)}
            `;

            modal.style.display = 'flex';
        }

        // 以主權名稱取得顏色 class
        function getSovereignClass(name) {
            const classes = {
                '人民共和國': 'sovereign-people',
                '人民共和國(紅軍)': 'sovereign-people',
                '紅軍': 'sovereign-people',
                '臺灣': 'sovereign-taiwan',
                '台灣': 'sovereign-taiwan',
                '日本皇國': 'sovereign-japan',
                '印度支那聯盟': 'sovereign-indochina',
                '哈里發聯盟': 'sovereign-caliphate',
                '大韓邦聯': 'sovereign-korea',
                '努山達拉聯盟': 'sovereign-nusantara',
                '婆羅多聯盟': 'sovereign-bharata',
                '盎格魯國協': 'sovereign-anglo',
                '歐羅巴聯盟': 'sovereign-europa',
                '大北方國協': 'sovereign-northern'
            };
            return classes[name] || '';
        }

        // 關閉 Modal
        function closeModal() {
            document.getElementById('cityModal').style.display = 'none';
        }

        // 點擊 Modal 外部關閉
        document.getElementById('cityModal')?.addEventListener('click', function (e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>

    <style>
        /* Modal 樣式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 30px;
            border-radius: 15px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            font-size: 2em;
            cursor: pointer;
            color: var(--muted-text);
            transition: color 0.3s;
            z-index: 10;
            background: var(--card-bg);
            padding: 0 5px;
            border-radius: 50%;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--danger-color);
        }

        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                margin: 10px;
            }

            #cityDetail .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</body>

</html>
