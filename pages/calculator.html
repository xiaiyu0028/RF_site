        .actor-name-input.is-invalid {
            border-color: #dc3545;
            background-color: rgba(220, 53, 69, 0.06);
        }

        .actor-selection {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
            padding: 20px;
            background: var(--light-bg);
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .actor-input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .actor-input-group label {
            font-weight: bold;
            color: var(--dark-text);
            font-size: 0.9em;
        }

        .scarcity-display {
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 15px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1.2em;
        }

        .remove-btn:hover {
            background: #c82333;
        }

        .results-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        }

        .actor-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid var(--primary-color);
            box-shadow: var(--card-shadow);
        }

        .actor-card h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .actor-card .level-info {
            font-size: 0.85em;
            color: var(--muted-text);
            margin-bottom: 15px;
        }

        .effects-section {
            background: var(--light-bg);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .effects-section h4 {
            color: var(--dark-text);
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border-color);
        }

        .effect-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            color: var(--text-color);
        }

        .effect-value {
            font-weight: bold;
            color: var(--success-color);
        }

        .power-result {
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--accent-color) 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 15px;
        }

        .summary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
        }

        .summary h3 {
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .summary .total-power {
            font-size: 3em;
            font-weight: bold;
        }

        .btn-add {
            width: 100%;
            margin-top: 15px;
        }

        .btn-calculate {
            width: 100%;
            margin-top: 20px;
            padding: 18px;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .actor-selection {
                grid-template-columns: 1fr;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }
        }

    <script src="../js/app.js"></script>
    <script>
        let parsedActors = null;
        let actorNames = [];
        let actorCount = 0;

        // 載入角色資料
        async function loadActorData() {
            try {
                // 加入時間戳避免快取問題
                const timestamp = new Date().getTime();
                // 嘗試載入 parsed_actors_skill.json（包含解析後的被動技能）
                let response = await fetch(`../cal_power/parsed_actors_skill.json?t=${timestamp}`);
                if (!response.ok) {
                    // 如果沒有，嘗試載入 parsed_actors.json
                    response = await fetch(`../cal_power/parsed_actors_skill.json`);
                }

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                parsedActors = await response.json();
                actorNames = Object.keys(parsedActors).sort((a, b) => a.localeCompare(b, 'zh-TW'));
                console.log(`載入 ${actorNames.length} 個角色資料`);
                buildActorDatalist();

                // 自動新增第一個角色選擇
                addActorSelection();
                updateActorCount();

            } catch (error) {
                console.error('載入角色資料失敗:', error);
                document.getElementById('results').innerHTML = `
                    <div class="alert alert-danger">
                        <strong>⚠️ 無法載入角色資料</strong><br><br>
                        請確認 cal_power 資料夾中存在角色資料檔案。<br>
                        如果是透過本地開啟，請使用 HTTP 伺服器：<br>
                        <code style="display: block; margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 4px;">
                            python -m http.server 8000
                        </code>
                    </div>
                `;
            }
        }

        // 更新角色數量顯示
        function updateActorCount() {
            const count = document.querySelectorAll('.actor-selection').length;
            document.getElementById('actorCountBadge').textContent = `${count} 個角色`;
        }

        // 建立角色名稱的搜尋清單（所有角色列共用同一份 datalist）
        function buildActorDatalist() {
            let datalist = document.getElementById('actor-datalist');
            if (!datalist) {
                datalist = document.createElement('datalist');
                datalist.id = 'actor-datalist';
                document.body.appendChild(datalist);
            }
            datalist.innerHTML = actorNames.map(name => {
                const info = parsedActors[name] || {};
                const label = [info.scarcity, info.nation, info.actor_category].filter(Boolean).join(' · ');
                return `<option value="${name}"${label ? ` label="${label}"` : ''}></option>`;
            }).join('');
        }

        // 新增角色選擇區塊
        function addActorSelection() {
            if (!parsedActors) {
                alert('角色資料尚未載入完成');
                return;
            }

            const container = document.getElementById('actors-container');
            const id = actorCount++;

            const div = document.createElement('div');
            div.className = 'actor-selection';
            div.id = `actor-${id}`;
            div.innerHTML = `
                <div class="actor-input-group">
                    <label>角色名稱</label>
                    <input type="text" class="form-control actor-name-input" id="actor-select-${id}"
                           list="actor-datalist" autocomplete="off" placeholder="輸入名稱搜尋…"
                           oninput="updateActorInfo(${id})" onchange="updateActorInfo(${id})">
                </div>
                <div class="actor-input-group">
                    <label>稀有度</label>
                    <div class="scarcity-display" id="scarcity-${id}">-</div>
                </div>
                <div class="actor-input-group">
                    <label>等級</label>
                    <input type="number" class="form-control" id="level-${id}" min="1" max="300" value="160" placeholder="等級">
                </div>
                <div class="actor-input-group" style="display: flex; flex-direction: row; align-items: center; gap: 5px; margin-top: 25px;">
                    <input type="checkbox" id="costume-${id}" style="width: 20px; height: 20px;">
                    <label for="costume-${id}" style="margin: 0; cursor: pointer;">是否裝備造型 (x1.2)</label>
                </div>
                <div class="actor-input-group">
                    <label>武器</label>
                    <select class="form-control" id="weapon-${id}">
                        <option value="無符文">無符文</option>
                        <option value="原初" selected>原初</option>
                        <option value="強化">強化</option>
                        <option value="高等">高等</option>
                        <option value="限定">限定</option>
                        <option value="排名">排名</option>
                        <option value="庚子">庚子</option>
                        <option value="保定">保定</option>
                    </select>
                </div>
                <button class="remove-btn" onclick="removeActorSelection(${id})" title="移除角色">✖</button>
            `;

            container.appendChild(div);
            updateActorCount();
        }

        // 移除角色選擇
        function removeActorSelection(id) {
            const element = document.getElementById(`actor-${id}`);
            if (element) {
                element.remove();
                updateActorCount();
            }
        }

        // 更新角色資訊
        function updateActorInfo(id) {
            const select = document.getElementById(`actor-select-${id}`);
            const actorName = select.value.trim();
            const scarcityDiv = document.getElementById(`scarcity-${id}`);

            // 打字中或打錯字時給視覺提示，避免無效名稱在計算時被靜默略過
            select.classList.toggle('is-invalid', Boolean(actorName) && !parsedActors[actorName]);

            if (actorName && parsedActors[actorName]) {
                const scarcity = parsedActors[actorName].scarcity || 'R';
                scarcityDiv.textContent = scarcity;
                scarcityDiv.className = `scarcity-display scarcity-${scarcity}`;
            } else {
                scarcityDiv.textContent = '-';
                scarcityDiv.className = 'scarcity-display';
            }
        }

        // 取 10 的倍數
        function floorTo10(n) {
            n = parseInt(n || 0);
            return n - (n % 10);
        }

        // 解析被動技能字串
        function parseSkillDescription(desc) {
            const result = { self: { atk: 0, def: 0, hp: 0 }, category: {}, nation: {} };
            if (!desc) return result;
            
            const regex = /(?:(.*?)(陣營成員|型成員))?(自身)?(攻擊力|受到傷害|防禦力|血量)([+-])\s*(\d+(?:\.\d+)?)%/g;
            let match;
            
            while ((match = regex.exec(desc)) !== null) {
                const prefix = match[1] ? match[1].trim() : ''; 
                const type = match[2]; 
                const isSelf = match[3] === '自身' || (!prefix && !type && !match[3]);
                
                const statName = match[4]; 
                const sign = match[5]; 
                const val = parseFloat(match[6]);
                
                let statKey = '';
                let actualVal = val;
                
                if (statName === '攻擊力') statKey = 'atk';
                else if (statName === '受到傷害') {
                    statKey = 'def';
                    // 受到傷害-X% translates to DEF +X%
                    actualVal = sign === '-' ? val : -val; 
                }
                else if (statName === '防禦力') statKey = 'def';
                else if (statName === '血量') statKey = 'hp';
                
                if (statName !== '受到傷害' && sign === '-') {
                    actualVal = -val;
                }

                if (isSelf) {
                    result.self[statKey] += actualVal;
                } else if (type === '陣營成員') {
                    if (!result.nation[prefix]) result.nation[prefix] = { atk: 0, def: 0, hp: 0 };
                    result.nation[prefix][statKey] += actualVal;
                } else if (type === '型成員') {
                    if (!result.category[prefix]) result.category[prefix] = { atk: 0, def: 0, hp: 0 };
                    result.category[prefix][statKey] += actualVal;
                }
            }
            return result;
        }

        // 取得特定等級的被動技能
        function getActivePassiveSkill(actorData, activeLevel) {
            if (actorData.parsed_passive_skills) {
                return actorData.parsed_passive_skills[String(activeLevel)] || {};
            }
            
            if (actorData.passive_skills && Array.isArray(actorData.passive_skills)) {
                const skill = actorData.passive_skills.find(s => s.level === activeLevel);
                if (skill) {
                    return parseSkillDescription(skill.description || '');
                }
            }
            
            return { self: { atk: 0, def: 0, hp: 0 }, category: {}, nation: {} };
        }

        // 計算被動技能效果
        function calculatePassive(actors) {
            const totalEffects = {
                category: {},
                nation: {}
            };

            // 初始化類別和國家效果
            actors.forEach(actor => {
                if (!actor.name || !parsedActors[actor.name]) return;
                const actorData = parsedActors[actor.name];
                if (actorData.actor_category && !totalEffects.category[actorData.actor_category]) {
                    totalEffects.category[actorData.actor_category] = { atk: 0, def: 0, hp: 0 };
                }
                if (actorData.nation && !totalEffects.nation[actorData.nation]) {
                    totalEffects.nation[actorData.nation] = { atk: 0, def: 0, hp: 0 };
                }
            });

            // 計算效果
            actors.forEach(actor => {
                if (!actor.name || !parsedActors[actor.name]) return;

                const actorData = parsedActors[actor.name];
                const activeLevel = floorTo10(actor.level);
                const activeEffect = getActivePassiveSkill(actorData, activeLevel);
                const costumeMultiplier = actor.hasCostume ? 1.2 : 1.0;

                if (activeEffect.category) {
                    Object.keys(activeEffect.category).forEach(cat => {
                        if (!totalEffects.category[cat]) {
                            totalEffects.category[cat] = { atk: 0, def: 0, hp: 0 };
                        }
                        ['atk', 'def', 'hp'].forEach(stat => {
                            totalEffects.category[cat][stat] += (activeEffect.category[cat][stat] || 0) * costumeMultiplier;
                        });
                    });
                }

                if (activeEffect.nation) {
                    Object.keys(activeEffect.nation).forEach(nat => {
                        if (!totalEffects.nation[nat]) {
                            totalEffects.nation[nat] = { atk: 0, def: 0, hp: 0 };
                        }
                        ['atk', 'def', 'hp'].forEach(stat => {
                            totalEffects.nation[nat][stat] += (activeEffect.nation[nat][stat] || 0) * costumeMultiplier;
                        });
                    });
                }
            });

            return totalEffects;
        }

        // 計算單一角色戰力
        function calculatePower(effects, scarcity, level, weapon) {
            const powerMultiplier = {
                'R': 1.0,
                'SR': 1.2,
                'SSR': 1.4
            };

            const weaponMultiplier = {
                '無符文': 1.0,
                '原初': 1.7,
                '強化': 2.1,
                '高等': 5.0,
                '限定': 2.5,
                '排名': 7.0,
                '庚子': 8.0,
                '保定': 10.0
            };

            // 稀有度等級上限
            if (scarcity === 'R') level = Math.min(level, 90);
            else if (scarcity === 'SR') level = Math.min(level, 160);
            else if (scarcity === 'SSR') level = Math.min(level, 300);

            const multiplier = powerMultiplier[scarcity] || 1.0;
            const weaponMult = weaponMultiplier[weapon] || 1.0;
            const atkBonus = effects.atk || 0;
            const defBonus = effects.def || 0;
            const hpBonus = effects.hp || 0;

            const totalPower = level * multiplier * weaponMult * (1 + ((1 + (atkBonus / 100 + hpBonus / 100)) * (1 + defBonus / 100) - 1) * 0.2) / 10 + 4;
            
            return totalPower;
        }

        // 計算所有角色戰力
        function calculateAllPowers() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 15px;">計算中...</p>
                </div>
            `;

            setTimeout(() => {
                try {
                    // 收集所有選擇的角色
                    const actors = [];
                    const unknownNames = [];
                    const actorElements = document.querySelectorAll('.actor-selection');

                    actorElements.forEach((element) => {
                        const id = element.id.split('-')[1];
                        const selectElement = document.getElementById(`actor-select-${id}`);
                        const levelElement = document.getElementById(`level-${id}`);
                        const weaponElement = document.getElementById(`weapon-${id}`);
                        const costumeElement = document.getElementById(`costume-${id}`);

                        const name = selectElement ? selectElement.value.trim() : '';
                        const level = parseInt(levelElement?.value) || 160;
                        const weapon = weaponElement ? weaponElement.value : '原初';
                        const hasCostume = costumeElement ? costumeElement.checked : false;

                        if (name && parsedActors[name]) {
                            actors.push({
                                name: name,
                                level: level,
                                weapon: weapon,
                                hasCostume: hasCostume,
                                scarcity: parsedActors[name].scarcity || 'R'
                            });
                        } else if (name) {
                            unknownNames.push(name);
                        }
                    });

                    if (unknownNames.length > 0) {
                        resultsDiv.innerHTML = `
                            <div class="alert alert-warning">
                                ⚠️ 找不到這些角色：${unknownNames.join('、')}<br>
                                請從搜尋清單中選擇正確的角色名稱。
                            </div>
                        `;
                        return;
                    }

                    if (actors.length === 0) {
                        resultsDiv.innerHTML = `
                            <div class="alert alert-warning">
                                ⚠️ 請至少選擇一個角色
                            </div>
                        `;
                        return;
                    }

                    // 計算所有被動效果
                    const totalEffects = calculatePassive(actors);

                    // 計算每個角色的戰力
                    let html = '';
                    let totalPowerSum = 0;

                    actors.forEach(actor => {
                        const actorData = parsedActors[actor.name];
                        const selfEffects = { atk: 0, def: 0, hp: 0 };

                        // 獲取自身被動效果
                        const effLevel = floorTo10(actor.level);
                        const activeEffect = getActivePassiveSkill(actorData, effLevel);
                        const costumeMultiplier = actor.hasCostume ? 1.2 : 1.0;

                        if (activeEffect.self) {
                            ['atk', 'def', 'hp'].forEach(stat => {
                                selfEffects[stat] += (activeEffect.self[stat] || 0) * costumeMultiplier;
                            });
                        }

                        // 加上陣營和國家效果
                        const actorCategory = actorData.actor_category || '未知';
                        const actorNation = actorData.nation || '未知';

                        if (totalEffects.category[actorCategory]) {
                            ['atk', 'def', 'hp'].forEach(stat => {
                                selfEffects[stat] += totalEffects.category[actorCategory][stat] || 0;
                            });
                        }

                        if (totalEffects.nation[actorNation]) {
                            ['atk', 'def', 'hp'].forEach(stat => {
                                selfEffects[stat] += totalEffects.nation[actorNation][stat] || 0;
                            });
                        }

                        // 計算戰力
                        const power = calculatePower(selfEffects, actor.scarcity, actor.level, actor.weapon);
                        totalPowerSum += power;

                        html += `
                            <div class="actor-card">
                                <h3>
                                    <span>${actor.name} ${actor.hasCostume ? '👗' : ''}</span>
                                    <span class="badge scarcity-${actor.scarcity}">${actor.scarcity}</span>
                                </h3>
                                <div class="level-info">
                                    等級: ${actor.level}（生效: Lv.${effLevel}）| 武器: ${actor.weapon} | 
                                    職業: ${actorCategory} | 陣營: ${actorNation}
                                </div>
                                
                                <div class="effects-section">
                                    <h4>📊 效果加成</h4>
                                    <div class="effect-item">
                                        <span>攻擊力加成</span>
                                        <span class="effect-value">+${selfEffects.atk.toFixed(1)}%</span>
                                    </div>
                                    <div class="effect-item">
                                        <span>防禦力加成</span>
                                        <span class="effect-value">+${selfEffects.def.toFixed(1)}%</span>
                                    </div>
                                    <div class="effect-item">
                                        <span>生命值加成</span>
                                        <span class="effect-value">+${selfEffects.hp.toFixed(1)}%</span>
                                    </div>
                                </div>
                                
                                <div class="power-result">
                                    ⚔️ 戰力：${power.toFixed(2)}
                                </div>
                            </div>
                        `;
                    });

                    // 顯示總戰力
                    const summaryHtml = `
                        <div class="summary">
                            <h3>🏆 隊伍總戰力 🏆</h3>
                            <div class="total-power">${totalPowerSum.toFixed(2)}</div>
                            <div style="margin-top: 10px;">已選擇 ${actors.length} 個角色</div>
                        </div>
                    `;

                    resultsDiv.innerHTML = summaryHtml + '<div class="results-grid">' + html + '</div>';

                } catch (error) {
                    console.error('計算錯誤:', error);
                    resultsDiv.innerHTML = `
                        <div class="alert alert-danger">
                            ❌ 計算過程發生錯誤: ${error.message}
                        </div>
                    `;
                }
            }, 100);
        }

        // 頁面載入時初始化
        window.addEventListener('DOMContentLoaded', loadActorData);
    </script>
</body>

</html>
