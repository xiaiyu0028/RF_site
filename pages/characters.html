<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RF 角色資訊 - 完整角色數據，包含職業、陣營、天賦表、符文類型、等級數值">
    <title>角色資訊 - RF 攻略網站</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/design-system.css">
</head>

<body>
    <!-- 導航欄 -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="../index.html" class="navbar-brand">
                ⚔️ RF 攻略網站
            </a>
            <button class="navbar-toggle" onclick="toggleMenu()">☰</button>
            <ul class="navbar-menu" id="navMenu">
                <li><a href="../index.html">首頁</a></li>
                <li><a href="cities.html">城鎮資訊</a></li>
                <li><a href="characters.html" class="active">角色資訊</a></li>
                <li><a href="calculator.html">戰力計算器</a></li>
                <li><a href="guide.html">新手教學</a></li>
                <li><a href="query.html">查詢功能</a></li>
                <li><a href="nations.html">國策資訊</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="content-wrapper">
            <div class="page-header">
                <h1>👤 角色資訊</h1>
                <p>完整角色數據，包含職業、陣營、天賦表、符文類型、等級數值</p>
            </div>

            <!-- 搜尋與篩選 -->
            <div class="card data-toolbar">
                <div class="search-box">
                    <input type="text" id="characterSearch" placeholder="搜尋角色名稱...">
                </div>

                <div class="grid grid-4">
                    <div class="form-group">
                        <label class="form-label">稀有度</label>
                        <select class="form-control" id="scarcityFilter">
                            <option value="">全部稀有度</option>
                            <option value="R">R</option>
                            <option value="SR">SR</option>
                            <option value="SSR">SSR</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">職業</label>
                        <select class="form-control" id="roleFilter">
                            <option value="">全部職業</option>
                            <option value="宣傳家">宣傳家</option>
                            <option value="資助者">資助者</option>
                            <option value="間諜">間諜</option>
                            <option value="游擊隊">游擊隊</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">陣營</label>
                        <select class="form-control" id="nationFilter">
                            <option value="">全部陣營</option>
                            <option value="1">紅軍</option>
                            <option value="2">臺灣</option>
                            <option value="3">香港</option>
                            <option value="4">藏國</option>
                            <option value="5">維吾爾</option>
                            <option value="6">哈薩克</option>
                            <option value="7">滿洲</option>
                            <option value="8">蒙古</option>
                            <option value="9">自由勢力</option>
                            <option value="10">反賊聯盟</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">排序</label>
                        <select class="form-control" id="sortFilter">
                            <option value="name">名稱</option>
                            <option value="scarcity">稀有度</option>
                            <option value="maxLevel">最大等級</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 統計資訊 -->
            <div class="grid grid-4" style="margin-bottom: 25px;">
                <div class="stat-box"
                    style="background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); color: #333;">
                    <div class="stat-value" id="rCount">-</div>
                    <div class="stat-label">R 角色</div>
                </div>
                <div class="stat-box"
                    style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); color: #333;">
                    <div class="stat-value" id="srCount">-</div>
                    <div class="stat-label">SR 角色</div>
                </div>
                <div class="stat-box" style="background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);">
                    <div class="stat-value" id="ssrCount">-</div>
                    <div class="stat-label">SSR 角色</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="totalCount">-</div>
                    <div class="stat-label">總計</div>
                </div>
            </div>

            <!-- 角色列表 -->
            <div id="charactersContainer">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p style="margin-top: 15px;">載入角色資料中...</p>
                </div>
            </div>

            <!-- 角色詳情 Modal -->
            <div id="characterModal" class="modal" style="display: none;">
                <div class="modal-content">
                    <span class="modal-close" onclick="closeCharacterModal()">&times;</span>
                    <div id="characterDetail"></div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <p>RF 攻略網站 | 使用 GitHub Pages 建置</p>
        </footer>
    </div>

    <script src="../js/app.js"></script>
    <script>
        let charactersData = [];
        let imageIndex = null;  // 圖片索引

        // 初始化
        document.addEventListener('DOMContentLoaded', async function () {
            const params = new URLSearchParams(window.location.search);
            document.getElementById('characterSearch').value = params.get('q') || '';
            document.getElementById('scarcityFilter').value = params.get('rarity') || '';
            document.getElementById('roleFilter').value = params.get('role') || '';
            document.getElementById('nationFilter').value = params.get('nation') || '';
            document.getElementById('sortFilter').value = params.get('sort') || 'name';
            try {
                // 同時載入角色資料和圖片索引
                const timestamp = new Date().getTime();
                const [actorResponse, imageResponse] = await Promise.all([
                    fetch(`../cal_power/unique_actors.json?t=${timestamp}`),
                    fetch(`../cal_power/image_index.json?t=${timestamp}`)
                ]);
                if (!actorResponse.ok) throw new Error('載入角色資料失敗');
                const data = await actorResponse.json();

                // 載入圖片索引（允許失敗）
                try {
                    if (imageResponse.ok) {
                        imageIndex = await imageResponse.json();
                    }
                } catch (e) {
                    console.warn('圖片索引載入失敗，將只顯示基本圖片:', e);
                }

                // 轉換資料格式 - 使用實際 JSON 資料
                charactersData = data.map((actor, index) => ({
                    id: index + 1,
                    name: actor.actor_prototype?.name || '未知',
                    scarcity: actor.scarcity || 'R',
                    role: actor.actor_prototype?.actor_category?.name || '未知',
                    nation: actor.nation_id || 0,
                    baseATK: actor.actor_prototype?.offense_base_value || 0,
                    atkPerLevel: actor.actor_prototype?.offense_elevation_value || 0,
                    baseHP: actor.actor_prototype?.blood_base_value || 0,
                    hpPerLevel: actor.actor_prototype?.blood_elevation_value || 0,
                    maxLevel: getMaxLevelByScarcity(actor.scarcity),
                    runeType: actor.no_weapon_name || '未知',
                    passiveSkills: actor.passive_skills || [],
                    biography: actor.actor_prototype?.description || `${actor.actor_prototype?.name || '未知'}的故事...`,
                    religion: actor.actor_prototype?.religion || '',
                    family: actor.actor_prototype?.family || '',
                    ethnicGroup: actor.actor_prototype?.ethnic_group || '',
                    headImage: actor.head_image || '',
                    halfImage: actor.half_image || '',
                    gifImage: actor.gif_image || '',
                    activeSkill: actor.active_skill || null,
                    activeSkills: actor.actor_prototype?.active_skills || [],
                    talent1: actor.actor_prototype?.talent_1 || '',
                    talent2: actor.actor_prototype?.talent_2 || ''
                }));

                // 更新統計
                updateStats();

                // 渲染角色
                filterCharacters();
            } catch (error) {
                console.error('載入資料失敗:', error);
                document.getElementById('charactersContainer').innerHTML = `
                    <div class="alert alert-danger">
                        載入角色資料失敗，請確認 cal_power/unique_actors.json 檔案存在
                    </div>
                `;
            }

            // 綁定事件
            document.getElementById('characterSearch').addEventListener('input', debounce(filterCharacters, 300));
            document.getElementById('scarcityFilter').addEventListener('change', filterCharacters);
            document.getElementById('roleFilter').addEventListener('change', filterCharacters);
            document.getElementById('nationFilter').addEventListener('change', filterCharacters);
            document.getElementById('sortFilter').addEventListener('change', filterCharacters);
        });

        function getMaxLevelByScarcity(scarcity) {
            switch (scarcity) {
                case 'SSR':
                    return 300;
                case 'SR':
                    return 160;
                case 'R':
                default:
                    return 90;
            }
        }

        // 更新統計
        function updateStats() {
            const rCount = charactersData.filter(c => c.scarcity === 'R').length;
            const srCount = charactersData.filter(c => c.scarcity === 'SR').length;
            const ssrCount = charactersData.filter(c => c.scarcity === 'SSR').length;

            document.getElementById('rCount').textContent = rCount;
            document.getElementById('srCount').textContent = srCount;
            document.getElementById('ssrCount').textContent = ssrCount;
            document.getElementById('totalCount').textContent = charactersData.length;
        }

        // 篩選角色
        function filterCharacters() {
            const search = document.getElementById('characterSearch').value.toLowerCase();
            const scarcity = document.getElementById('scarcityFilter').value;
            const role = document.getElementById('roleFilter').value;
            const nation = document.getElementById('nationFilter').value;
            const sortBy = document.getElementById('sortFilter').value;

            let filtered = charactersData.filter(char => {
                const matchSearch = char.name.toLowerCase().includes(search);
                const matchScarcity = !scarcity || char.scarcity === scarcity;
                const matchRole = !role || char.role === role;
                const matchNation = !nation || char.nation == nation;
                return matchSearch && matchScarcity && matchRole && matchNation;
            });

            // 排序
            filtered.sort((a, b) => {
                switch (sortBy) {
                    case 'scarcity':
                        const order = { 'SSR': 0, 'SR': 1, 'R': 2 };
                        return order[a.scarcity] - order[b.scarcity];
                    case 'maxLevel':
                        return b.maxLevel - a.maxLevel;
                    default:
                        return a.name.localeCompare(b.name, 'zh-TW');
                }
            });

            renderCharacters(filtered);
            const params = new URLSearchParams();
            if (search) params.set('q', search);
            if (scarcity) params.set('rarity', scarcity);
            if (role) params.set('role', role);
            if (nation) params.set('nation', nation);
            if (sortBy !== 'name') params.set('sort', sortBy);
            const query = params.toString();
            history.replaceState(null, '', `${window.location.pathname}${query ? `?${query}` : ''}`);
        }

        // 渲染角色列表
        function renderCharacters(characters) {
            const container = document.getElementById('charactersContainer');

            if (characters.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        沒有找到符合條件的角色
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="grid grid-auto">
                    ${characters.map(char => `
                        <div class="card character-card" onclick="showCharacterDetail('${char.name}')" style="cursor: pointer;">
                            <div class="card-header" style="display: flex; align-items: center; gap: 10px;">
                                ${char.headImage ? `<img src="${getAssetPath(char.headImage)}" alt="${char.name}" style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover;" onerror="this.style.display='none'">` : ''}
                                <span class="card-title">${char.name}</span>
                                <span class="badge ${getScarcityClass(char.scarcity)}" style="margin-left: auto;">${char.scarcity}</span>
                            </div>
                            <div class="card-body">
                                <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;">
                                    <span class="badge badge-primary">${getRoleName(char.role)}</span>
                                    <span class="badge ${getNationClass(char.nation)}">${getNationName(char.nation)}</span>
                                </div>
                                <p><strong>最大等級：</strong>${char.maxLevel}</p>
                                <p><strong>符文類型：</strong>${char.runeType}</p>
                                <p><strong>基礎ATK：</strong>${char.baseATK.toLocaleString()} (+${char.atkPerLevel}/等)</p>
                                <p><strong>基礎HP：</strong>${char.baseHP.toLocaleString()} (+${char.hpPerLevel}/等)</p>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 從圖片路徑提取角色代碼 (e.g. /images/actor/half/bustCM01.png -> CM01)
        function getCharacterCode(imagePath) {
            if (!imagePath) return '';
            const filename = imagePath.split('/').pop().split('.')[0]; // bustCM01
            // 移除前綴 bust/tachie/avatar
            return filename.replace(/^(bust|tachie|avatar)/, '');
        }

        // 從圖片索引中找出角色的所有造型圖片
        function findAllCharacterImages(char) {
            const images = [];
            const code = getCharacterCode(char.halfImage || char.gifImage || char.headImage);
            if (!code) return images;

            // 如果沒有圖片索引，使用基本圖片
            if (!imageIndex) {
                if (char.headImage) images.push({ src: getAssetPath(char.headImage), label: '頭像' });
                if (char.halfImage) images.push({ src: getAssetPath(char.halfImage), label: '半身像' });
                if (char.gifImage) images.push({ src: getAssetPath(char.gifImage), label: '動態圖' });
                return images;
            }

            // 從索引中搜尋所有匹配的圖片
            const findVariants = (files, prefix, dir, ext, baseLabel) => {
                if (!files) return;
                files.forEach(filename => {
                    const nameNoExt = filename.split('.')[0];
                    const fileCode = nameNoExt.replace(new RegExp(`^${prefix}`), '');
                    // 匹配：完全相同的 code，或者以 code 開頭的變體
                    if (fileCode === code || (fileCode.startsWith(code) && /^[A-Za-z0-9]/.test(fileCode.slice(code.length)))) {
                        const extra = fileCode.slice(code.length);
                        const label = extra ? `${baseLabel} (造型${extra})` : baseLabel;
                        const path = `/images/actor/${dir}/${filename}`;
                        images.push({ src: getAssetPath(path), label: label });
                    }
                });
            };

            // 按順序加入：頭像 -> 半身像 -> 全身像 -> 動態圖
            findVariants(imageIndex.head, 'avatar', 'head', 'png', '頭像');
            findVariants(imageIndex.half, 'bust', 'half', 'png', '半身像');
            findVariants(imageIndex.half_full, '', 'half_full', 'png', '全身像');
            findVariants(imageIndex.gif, 'tachie', 'gif', 'gif', '動態圖');

            return images;
        }

        // 顯示角色詳情
        function showCharacterDetail(charName) {
            const char = charactersData.find(c => c.name === charName);
            if (!char) return;

            currentGallerySlide = 0;  // 重置畫廊索引

            const modal = document.getElementById('characterModal');
            const detail = document.getElementById('characterDetail');

            // 準備天賦表格
            let skillsTable = '';
            if (char.passiveSkills && char.passiveSkills.length > 0) {
                skillsTable = `
                    <div style="margin-top: 25px;">
                        <div class="gallery-toggle" onclick="toggleSkillsTable()">
                            <h3 style="margin: 0;">📊 天賦表 <span style="font-size: 0.7em; font-weight: normal; color: var(--muted-text);">(${char.passiveSkills.length} 項技能)</span></h3>
                            <span class="gallery-arrow" id="skillsArrow">▼</span>
                        </div>
                        <div id="skillsTableContent" style="display: none; animation: slideDown 0.3s ease;">
                            <div class="table-container" style="margin-top: 10px;">
                                <table class="table">
                                    <thead>
                                        <tr><th>等級</th><th>被動技能效果</th></tr>
                                    </thead>
                                    <tbody>
                                        ${char.passiveSkills.map(skill => `
                                            <tr>
                                                <td><strong>Lv.${skill.level}</strong></td>
                                                <td>${skill.description}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            }

            // 主動技能區塊
            let activeSkillSection = '';
            if (char.activeSkills && char.activeSkills.length > 0) {
                activeSkillSection = `
                    <div style="margin-top: 25px;">
                        <h3 style="margin-bottom: 15px;">⚡ 主動技能</h3>
                        <div style="display: flex; flex-direction: column; gap: 15px;">
                            ${char.activeSkills.map(skill => `
                                <div class="card" style="margin: 0; border-left: 4px solid var(--primary-color);">
                                    <div class="card-body" style="display: flex; gap: 15px; align-items: flex-start;">
                                        ${skill.image ? `<img src="${getAssetPath(skill.image)}" alt="${skill.name}" style="width: 60px; height: 60px; border-radius: 8px; object-fit: cover; flex-shrink: 0;" onerror="this.style.display='none'">` : ''}
                                        <div style="flex: 1;">
                                            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px;">
                                                <strong style="font-size: 1.1em;">${skill.name}</strong>
                                                <span class="badge badge-primary">Lv.${skill.level}</span>
                                                <span class="badge" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white;">⚡ ${skill.activate_skill_point} 能量</span>
                                            </div>
                                            <p style="color: var(--text-color); margin: 0; line-height: 1.6;">${skill.description}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // 等級數值計算器
            const levelSlider = `
                <div style="margin-top: 25px;">
                    <h3 style="margin-bottom: 15px;">📈 等級數值計算</h3>
                    <div class="form-group">
                        <label class="form-label">輸入等級 (1 - ${char.maxLevel})：</label>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <input type="number" id="levelInput" min="1" max="${char.maxLevel}" value="1" 
                                   class="form-control" style="width: 100px; text-align: center;"
                                   oninput="updateCharStats(${char.baseATK}, ${char.atkPerLevel}, ${char.baseHP}, ${char.hpPerLevel}, ${char.maxLevel})">
                            <input type="range" id="levelSlider" min="1" max="${char.maxLevel}" value="1" 
                                   style="flex: 1;" oninput="syncLevelInput(this.value); updateCharStats(${char.baseATK}, ${char.atkPerLevel}, ${char.baseHP}, ${char.hpPerLevel}, ${char.maxLevel})">
                        </div>
                    </div>
                    <div class="grid grid-2" style="gap: 15px;">
                        <div class="stat-box" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                            <div class="stat-value" id="calcATK">${char.baseATK.toLocaleString()}</div>
                            <div class="stat-label">攻擊力 (ATK)</div>
                        </div>
                        <div class="stat-box" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                            <div class="stat-value" id="calcHP">${char.baseHP.toLocaleString()}</div>
                            <div class="stat-label">生命值 (HP)</div>
                        </div>
                    </div>
                </div>
            `;

            detail.innerHTML = `
                <div style="display: flex; align-items: flex-start; gap: 20px; margin-bottom: 25px;">
                    ${char.halfImage || char.gifImage ?
                    `<img src="${getAssetPath(char.halfImage || char.gifImage)}" alt="${char.name}" style="width: 120px; height: auto; border-radius: 10px; object-fit: contain;" onerror="this.outerHTML='<div style=\\'width: 100px; height: 100px; background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 2.5em;\\'>${char.name.charAt(0)}</div>'">`
                    : `<div style="width: 100px; height: 100px; background: linear-gradient(135deg, var(--primary-color), var(--primary-dark)); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 2.5em;">${char.name.charAt(0)}</div>`
                }
                    <div>
                        <h2 style="color: var(--primary-color); margin-bottom: 5px;">${char.name}</h2>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;">
                            <span class="badge ${getScarcityClass(char.scarcity)}">${char.scarcity}</span>
                            <span class="badge badge-primary">${getRoleName(char.role)}</span>
                            <span class="badge ${getNationClass(char.nation)}">${getNationName(char.nation)}</span>
                        </div>
                        ${char.talent1 ? `<p style="margin: 5px 0; font-style: italic; color: var(--muted-text);">${char.talent1}</p>` : ''}
                        ${char.talent2 ? `<p style="margin: 5px 0; font-weight: bold; color: var(--primary-color);">${char.talent2}</p>` : ''}
                    </div>
                </div>
                
                <div class="grid grid-2" style="gap: 25px;">
                    <div>
                        <h3 style="margin-bottom: 15px;">📋 基本資料</h3>
                        <table class="table">
                            <tr><th>角色名稱</th><td>${char.name}</td></tr>
                            <tr><th>稀有度</th><td>${char.scarcity}</td></tr>
                            <tr><th>職業</th><td>${getRoleName(char.role)}</td></tr>
                            <tr><th>陣營</th><td>${getNationName(char.nation)}</td></tr>
                            <tr><th>最大等級</th><td>${char.maxLevel}</td></tr>
                            <tr><th>符文類型</th><td>${char.runeType}</td></tr>
                        </table>
                    </div>
                    
                    <div>
                        <h3 style="margin-bottom: 15px;">📖 生平</h3>
                        <div class="card" style="margin: 0;">
                            <div class="card-body">
                                <p>${char.biography}</p>
                                <div style="margin-top: 10px; color: var(--muted-text); font-size: 0.9em;">
                                    ${char.religion ? `<div><strong>宗教：</strong>${char.religion}</div>` : ''}
                                    ${char.family ? `<div><strong>出生地：</strong>${char.family}</div>` : ''}
                                    ${char.ethnicGroup ? `<div><strong>族群：</strong>${char.ethnicGroup}</div>` : ''}
                                </div>
                            </div>
                        </div>
                        
                        <h3 style="margin: 20px 0 15px;">⚔️ 基礎數值</h3>
                        <table class="table">
                            <tr><th>基礎 ATK</th><td>${char.baseATK.toLocaleString()}</td></tr>
                            <tr><th>每等 ATK</th><td>+${char.atkPerLevel.toLocaleString()}</td></tr>
                            <tr><th>基礎 HP</th><td>${char.baseHP.toLocaleString()}</td></tr>
                            <tr><th>每等 HP</th><td>+${char.hpPerLevel.toLocaleString()}</td></tr>
                        </table>
                    </div>
                </div>
                
                ${levelSlider}
                ${activeSkillSection}
                ${skillsTable}
                ${generateImageGallery(char)}
            `;

            modal.style.display = 'flex';
        }

        // 同步等級輸入框與滑桿
        function syncLevelInput(value) {
            document.getElementById('levelInput').value = value;
        }

        function syncLevelSlider(value) {
            document.getElementById('levelSlider').value = value;
        }

        // 更新等級數值
        function updateCharStats(baseATK, atkPerLevel, baseHP, hpPerLevel, maxLevel) {
            const input = document.getElementById('levelInput');
            let level = parseInt(input.value) || 1;

            // 限制範圍
            if (level < 1) level = 1;
            if (level > maxLevel) level = maxLevel;

            // 同步滑桿
            syncLevelSlider(level);
            input.value = level;

            document.getElementById('calcATK').textContent = (baseATK + (level - 1) * atkPerLevel).toLocaleString();
            document.getElementById('calcHP').textContent = (baseHP + (level - 1) * hpPerLevel).toLocaleString();
        }

        // 關閉 Modal
        function closeCharacterModal() {
            document.getElementById('characterModal').style.display = 'none';
        }

        // 生成角色圖片畫廊
        function generateImageGallery(char) {
            const images = findAllCharacterImages(char);
            if (images.length === 0) return '';

            return `
                <div style="margin-top: 25px;">
                    <div class="gallery-toggle" onclick="toggleImageGallery()">
                        <h3 style="margin: 0;">🖼️ 角色造型 <span style="font-size: 0.7em; font-weight: normal; color: var(--muted-text);">(${images.length} 張圖片)</span></h3>
                        <span class="gallery-arrow" id="galleryArrow">▼</span>
                    </div>
                    <div id="imageGallery" class="image-gallery" style="display: none;">
                        <div class="gallery-viewport">
                            ${images.length > 1 ? `<button class="gallery-nav gallery-prev" onclick="changeGallerySlide(-1)">❮</button>` : ''}
                            <div class="gallery-slides" id="gallerySlides">
                                ${images.map((img, i) => `
                                    <div class="gallery-slide ${i === 0 ? 'active' : ''}" data-index="${i}">
                                        <img src="${img.src}" alt="${char.name} ${img.label}" 
                                             style="max-width: 100%; max-height: 450px; object-fit: contain; border-radius: 10px;"
                                             onerror="this.parentElement.innerHTML='<p style=\\'color: var(--muted-text);\\'>圖片載入失敗</p>'">
                                        <p class="gallery-label">${img.label}</p>
                                    </div>
                                `).join('')}
                            </div>
                            ${images.length > 1 ? `<button class="gallery-nav gallery-next" onclick="changeGallerySlide(1)">❯</button>` : ''}
                        </div>
                        ${images.length > 1 ? `
                            <div class="gallery-indicator">
                                <span id="galleryCounter">1 / ${images.length}</span>
                            </div>
                            <div class="gallery-dots">
                                ${images.map((_, i) => `
                                    <span class="gallery-dot ${i === 0 ? 'active' : ''}" onclick="goToGallerySlide(${i})"></span>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // 展開/收起天賦表
        function toggleSkillsTable() {
            const content = document.getElementById('skillsTableContent');
            const arrow = document.getElementById('skillsArrow');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                arrow.textContent = '▲';
            } else {
                content.style.display = 'none';
                arrow.textContent = '▼';
            }
        }

        // 展開/收起圖片畫廊
        let currentGallerySlide = 0;
        function toggleImageGallery() {
            const gallery = document.getElementById('imageGallery');
            const arrow = document.getElementById('galleryArrow');
            if (gallery.style.display === 'none') {
                gallery.style.display = 'block';
                arrow.textContent = '▲';
            } else {
                gallery.style.display = 'none';
                arrow.textContent = '▼';
            }
        }

        // 切換畫廊圖片
        function changeGallerySlide(direction) {
            const slides = document.querySelectorAll('.gallery-slide');
            const dots = document.querySelectorAll('.gallery-dot');
            if (slides.length === 0) return;

            slides[currentGallerySlide].classList.remove('active');
            if (dots[currentGallerySlide]) dots[currentGallerySlide].classList.remove('active');

            currentGallerySlide = (currentGallerySlide + direction + slides.length) % slides.length;

            slides[currentGallerySlide].classList.add('active');
            if (dots[currentGallerySlide]) dots[currentGallerySlide].classList.add('active');
            updateGalleryCounter(slides.length);
        }

        function goToGallerySlide(index) {
            const slides = document.querySelectorAll('.gallery-slide');
            const dots = document.querySelectorAll('.gallery-dot');
            if (slides.length === 0 || index < 0 || index >= slides.length) return;

            slides[currentGallerySlide].classList.remove('active');
            if (dots[currentGallerySlide]) dots[currentGallerySlide].classList.remove('active');

            currentGallerySlide = index;

            slides[currentGallerySlide].classList.add('active');
            if (dots[currentGallerySlide]) dots[currentGallerySlide].classList.add('active');
            updateGalleryCounter(slides.length);
        }

        function updateGalleryCounter(total) {
            const counter = document.getElementById('galleryCounter');
            if (counter) counter.textContent = `${currentGallerySlide + 1} / ${total}`;
        }

        // 點擊 Modal 外部關閉
        document.getElementById('characterModal')?.addEventListener('click', function (e) {
            if (e.target === this) {
                closeCharacterModal();
            }
        });
    </script>

    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 30px;
            border-radius: 15px;
            max-width: 1000px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-close {
            position: sticky;
            top: 0;
            float: right;
            font-size: 2em;
            cursor: pointer;
            color: var(--muted-text);
            transition: color 0.3s;
            z-index: 10;
            background: var(--card-bg);
            padding: 0 5px;
            border-radius: 50%;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--danger-color);
        }

        .character-card:hover {
            border-left: 5px solid var(--primary-color);
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .modal-content {
                padding: 20px;
                margin: 10px;
            }

            #characterDetail .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        /* 角色圖片畫廊 */
        .gallery-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 12px 15px;
            background: var(--light-bg);
            border-radius: 10px;
            transition: var(--transition);
            user-select: none;
        }

        .gallery-toggle:hover {
            background: var(--border-color);
        }

        .gallery-arrow {
            font-size: 1.2em;
            transition: transform 0.3s ease;
            color: var(--muted-text);
        }

        .image-gallery {
            margin-top: 15px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gallery-viewport {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            background: var(--light-bg);
            border-radius: 12px;
            padding: 20px;
            overflow: hidden;
        }

        .gallery-slide {
            display: none;
            text-align: center;
            width: 100%;
            animation: fadeIn 0.4s ease;
        }

        .gallery-slide.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .gallery-label {
            margin-top: 10px;
            font-size: 0.9em;
            color: var(--muted-text);
            font-weight: bold;
        }

        .gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            font-size: 1.5em;
            padding: 10px 14px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            transition: background 0.3s;
        }

        .gallery-nav:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        .gallery-prev {
            left: 10px;
        }

        .gallery-next {
            right: 10px;
        }

        .gallery-indicator {
            text-align: center;
            margin-top: 10px;
            font-size: 0.85em;
            color: var(--muted-text);
            font-weight: bold;
        }

        .gallery-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .gallery-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border-color);
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
        }

        .gallery-dot.active {
            background: var(--primary-color);
            transform: scale(1.3);
        }

        .gallery-dot:hover {
            background: var(--primary-color);
        }
    </style>
</body>

</html>
